# Global tool versions. Per-project versions go in the project's mise.toml.
# Upgrade "latest" tools with `mise upgrade`.

[tools]
# Runtimes
node = "24"
pnpm = "latest"
bun = "latest"
python = "3.13"
uv = "latest"

# CLI tools
actionlint = "latest"
fd = "latest"
fnox = { version = "latest", workflow = "release.yml" }
gitleaks = "latest"
jq = "latest"
opentofu = "latest"
ripgrep = "latest"
ruff = "latest"
shellcheck = "latest"
terraform = "latest"
yq = "latest"
godot = "4.7.2-stable"
"npm:typescript" = "latest"

[settings]
npm.package_manager = "pnpm"
